name: PR File Check

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review, edited]

permissions:
  pull-requests: read
  issues: write

jobs:
  check-files:
    runs-on: ubuntu-latest

    steps:
      - name: Check number of changed files
        uses: actions/github-script@v8
        with:
          script: |
            const { owner, repo } = context.repo;
            const pull_number = context.issue.number;

            const MARKER = "<!-- pr-file-check -->";

            // Get current PR information
            const { data: pr } = await github.rest.pulls.get({
              owner,
              repo,
              pull_number
            });

            const targetBranch = pr.base.ref;
            const changedFiles = pr.changed_files;

            console.log(`Target branch: ${targetBranch}`);
            console.log(`Changed files: ${changedFiles}`);

            // Rules for each target branch
            const RULES = {
              main: {
                maxFiles: 0,
                message: "I think you PRd into the wrong branch."
              },

              week2: {
                maxFiles: 3,
                message: "You should have 3 files changed (2 for online cohort)."
              },

              week4: {
                maxFiles: 1,
                message: "You should only have 1 file changed."
              },

              week6: {
                maxFiles: 1,
                message: "You should only have 1 file changed."
              }
            };

            const rule = RULES[targetBranch];

            // Find an existing automated comment from this workflow
            const comments = await github.paginate(
              github.rest.issues.listComments,
              {
                owner,
                repo,
                issue_number: pull_number,
                per_page: 100
              }
            );

            const existingComment = comments.find(
              comment =>
                comment.user.type === "Bot" &&
                comment.body.includes(MARKER)
            );

            // If this branch has no rule, remove any old warning
            if (!rule) {
              if (existingComment) {
                await github.rest.issues.deleteComment({
                  owner,
                  repo,
                  comment_id: existingComment.id
                });
              }

              console.log(`No rule configured for ${targetBranch}`);
              return;
            }

            // Check whether PR exceeds the branch-specific file limit
            if (changedFiles > rule.maxFiles) {

              const body = `${MARKER}
            ### ⚠️ PR Check

            ${rule.message}

            **Files changed:** ${changedFiles}
            **Target branch:** \`${targetBranch}\`

            _This is an automated reminder._`;

              // Update existing warning rather than posting duplicates
              if (existingComment) {
                await github.rest.issues.updateComment({
                  owner,
                  repo,
                  comment_id: existingComment.id,
                  body
                });
              } else {
                await github.rest.issues.createComment({
                  owner,
                  repo,
                  issue_number: pull_number,
                  body
                });
              }

            } else {

              // If they fix the PR, remove the warning
              if (existingComment) {
                await github.rest.issues.deleteComment({
                  owner,
                  repo,
                  comment_id: existingComment.id
                });
              }
            }
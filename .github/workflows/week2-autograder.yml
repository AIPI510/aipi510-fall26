name: Week 2 Autograder

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  autograde:
    if: github.event.pull_request.base.ref == 'week2'
    runs-on: ubuntu-latest

    steps:
      - name: Grade Week 2 submission
        uses: actions/github-script@v8
        with:
          script: |
            const { owner, repo } = context.repo;
            const pull_number = context.issue.number;
            const pr = context.payload.pull_request;
            const headSha = pr.head.sha;

            const MARKER = "<!-- week2-autograder -->";

            // =======================================================
            // HELPERS
            // =======================================================

            function result(passed, points, description) {
              return {
                passed,
                points: passed ? points : 0,
                possible: points,
                description
              };
            }

            function has(source, regex) {
              return regex.test(source || "");
            }

            // Detect comments near the bottom of the file.
            // Students are asked for 3–5 lines of notes.
            function countNotes(source) {
              if (!source) return 0;

              const lines = source.split("\n");
              const bottom = lines.slice(-25);

              return bottom.filter(line => {
                const trimmed = line.trim();

                return (
                  trimmed.startsWith("#") &&
                  trimmed.replace(/^#+\s*/, "").length >= 8
                );
              }).length;
            }

            // Recognize several reasonable ways to create/use a DataFrame.
            // Examples:
            // pd.DataFrame(...)
            // pd.DataFrame.from_dict(...)
            // pd.DataFrame.from_records(...)
            // pd.json_normalize(...)
            function usesDataFrame(source) {
              return (
                has(source, /\bpd\s*\.\s*DataFrame\b/) ||
                has(source, /\bDataFrame\b/) ||
                has(source, /\bpd\s*\.\s*json_normalize\b/) ||
                has(source, /\bjson_normalize\b/)
              );
            }

            // Recognize several reasonable ways to display collected data.
            //
            // Examples:
            // print(df.head())
            // print(df.head(5))
            // print(df)
            // print(df["joke"])
            // print(results)
            // display(df)
            function displaysData(source) {
              if (!source) return false;

              if (has(source, /\.head\s*\(\s*(?:5\s*)?\)/)) {
                return true;
              }

              if (has(source, /\bdisplay\s*\(/)) {
                return true;
              }

              const lines = source.split("\n");

              return lines.some(line => {
                const trimmed = line.trim();

                const match = trimmed.match(
                  /^print\s*\((.*)\)\s*;?\s*$/
                );

                if (!match) return false;

                const argument = match[1].trim();

                // Ignore print statements that contain only a literal message:
                // print("Here are my results")
                //
                // Accept expressions:
                // print(df)
                // print(df["joke"])
                // print(results)
                if (
                  /^"(?:[^"\\]|\\.)*"$/.test(argument) ||
                  /^'(?:[^'\\]|\\.)*'$/.test(argument)
                ) {
                  return false;
                }

                return argument.length > 0;
              });
            }

            // Accept a range of reasonable cleaning/manipulation approaches.
            function cleansData(source) {
              if (!source) return false;

              const cleaningPatterns = [
                /\.dropna\s*\(/,
                /\.drop_duplicates\s*\(/,
                /\.drop\s*\(/,
                /\.fillna\s*\(/,
                /\.replace\s*\(/,
                /\.astype\s*\(/,
                /\.rename\s*\(/,
                /\.reset_index\s*\(/,
                /\.query\s*\(/,
                /\.sort_values\s*\(/,
                /\.str\./,
                /\.loc\s*\[/,
                /\.iloc\s*\[/,

                // Manual DataFrame filtering, e.g.
                // df = df[df["Rk"] != "Rk"]
                /=\s*[A-Za-z_]\w*\s*\[\s*[A-Za-z_]\w*\s*\[[^\]]+\]\s*(?:!=|==|>=|<=|>|<)/
              ];

              return cleaningPatterns.some(regex =>
                regex.test(source)
              );
            }

            // Recognize common ways to parse serial values.
            function parsesSerialData(source) {
              return (
                has(source, /\.split\s*\(/) ||
                has(source, /\.strip\s*\(/) ||
                has(source, /\.decode\s*\(/) ||
                has(source, /json\s*\.\s*loads\s*\(/) ||
                has(source, /csv\s*\.\s*reader\s*\(/)
              );
            }

            async function getStudentFiles() {
              const files = await github.paginate(
                github.rest.pulls.listFiles,
                {
                  owner,
                  repo,
                  pull_number,
                  per_page: 100
                }
              );

              return files.filter(file =>
                file.status !== "removed" &&
                file.filename.endsWith(".py") &&
                (
                  file.filename.startsWith("week2/web/") ||
                  file.filename.startsWith("week2/api/") ||
                  file.filename.startsWith("week2/arduino/")
                )
              );
            }

            async function readFile(path) {
              try {
                const response = await github.rest.repos.getContent({
                  owner,
                  repo,
                  path,
                  ref: headSha
                });

                if (Array.isArray(response.data)) {
                  return "";
                }

                return Buffer.from(
                  response.data.content,
                  "base64"
                ).toString("utf8");

              } catch (error) {
                console.log(`Could not read ${path}: ${error.message}`);
                return "";
              }
            }

            // =======================================================
            // FIND STUDENT FILES
            // =======================================================

            const studentFiles = await getStudentFiles();

            const webFiles = studentFiles.filter(
              f => f.filename.startsWith("week2/web/")
            );

            const apiFiles = studentFiles.filter(
              f => f.filename.startsWith("week2/api/")
            );

            const arduinoFiles = studentFiles.filter(
              f => f.filename.startsWith("week2/arduino/")
            );

            const webFile = webFiles[0];
            const apiFile = apiFiles[0];
            const arduinoFile = arduinoFiles[0];

            const webSource = webFile
              ? await readFile(webFile.filename)
              : "";

            const apiSource = apiFile
              ? await readFile(apiFile.filename)
              : "";

            const arduinoSource = arduinoFile
              ? await readFile(arduinoFile.filename)
              : "";

            // =======================================================
            // GRADING
            // =======================================================

            const grades = [];

            // =======================================================
            // SUBMISSION STRUCTURE — 2 POINTS
            // =======================================================

            grades.push({
              section: "Submission Structure",
              checks: [
                result(
                  webFiles.length === 1 &&
                  apiFiles.length === 1 &&
                  arduinoFiles.length === 1,
                  1,
                  "One Python file submitted in each station directory"
                ),

                result(
                  webFile &&
                  apiFile &&
                  arduinoFile &&
                  webFile.filename.split("/").pop() ===
                    apiFile.filename.split("/").pop() &&
                  apiFile.filename.split("/").pop() ===
                    arduinoFile.filename.split("/").pop(),
                  1,
                  "Same student filename used for all three stations"
                )
              ]
            });

            // =======================================================
            // STATION 1: WEB SCRAPING — 6 POINTS
            // =======================================================

            const webMakesRequest =
              has(webSource, /requests\s*\.\s*get\s*\(/) ||
              (
                has(webSource, /requests\s*\.\s*request\s*\(/) &&
                has(webSource, /["']GET["']/i)
              );

            const webParsesHTML =
              has(webSource, /\bBeautifulSoup\s*\(/) ||
              has(webSource, /\bread_html\s*\(/);

            const webCreatesTable =
              usesDataFrame(webSource) ||
              has(webSource, /\bread_html\s*\(/);

            grades.push({
              section: "Station 1: Web Scraping",
              checks: [
                result(
                  webMakesRequest,
                  1,
                  "Downloads data from a webpage"
                ),

                result(
                  webParsesHTML,
                  1,
                  "Uses BeautifulSoup or pandas.read_html"
                ),

                result(
                  webCreatesTable,
                  1,
                  "Extracts tabular data into a DataFrame"
                ),

                result(
                  cleansData(webSource),
                  1,
                  "Includes a data-cleaning or filtering step"
                ),

                result(
                  displaysData(webSource),
                  1,
                  "Displays the collected data"
                ),

                result(
                  countNotes(webSource) >= 3,
                  1,
                  "Includes at least 3 lines of notes near the bottom"
                )
              ]
            });

            // =======================================================
            // STATION 2: API — 6 POINTS
            // =======================================================

            const apiMakesRequest =
              has(apiSource, /requests\s*\.\s*get\s*\(/) ||
              (
                has(apiSource, /requests\s*\.\s*request\s*\(/) &&
                has(apiSource, /["']GET["']/i)
              );

            const apiParsesJSON =
              has(apiSource, /\.json\s*\(\s*\)/) ||
              has(apiSource, /json\s*\.\s*loads\s*\(/);

            // Includes:
            // response["jokes"]
            // data["temperature"]
            // response.get("results")
            // df["joke"]
            const apiExtractsFields =
              has(
                apiSource,
                /[A-Za-z_]\w*\s*\[\s*["'][^"']+["']\s*\]/
              ) ||
              has(
                apiSource,
                /[A-Za-z_]\w*\s*\.\s*get\s*\(\s*["']/
              );

            grades.push({
              section: "Station 2: API",
              checks: [
                result(
                  apiMakesRequest,
                  1,
                  "Makes an HTTP GET request"
                ),

                result(
                  apiParsesJSON,
                  1,
                  "Parses a JSON response"
                ),

                result(
                  usesDataFrame(apiSource),
                  1,
                  "Stores API data in a DataFrame"
                ),

                result(
                  apiExtractsFields,
                  1,
                  "Extracts fields from the API response"
                ),

                result(
                  displaysData(apiSource),
                  1,
                  "Displays the collected data"
                ),

                result(
                  countNotes(apiSource) >= 3,
                  1,
                  "Includes at least 3 lines of notes near the bottom"
                )
              ]
            });

            // =======================================================
            // STATION 3: ARDUINO — 6 POINTS
            // =======================================================

            const arduinoConnects =
              has(arduinoSource, /serial\s*\.\s*Serial\s*\(/) ||
              has(arduinoSource, /\bSerial\s*\(/);

            const arduinoReads =
              has(arduinoSource, /\.readline\s*\(/) ||
              has(arduinoSource, /\.read\s*\(/);

            const arduinoStructuresData =
              usesDataFrame(arduinoSource) ||
              has(arduinoSource, /\.append\s*\(/) ||
              has(arduinoSource, /\bdict\s*\(/);

            // Assignment allows saving data to a CSV OR DataFrame.
            const arduinoSavesData =
              has(arduinoSource, /\.to_csv\s*\(/) ||
              usesDataFrame(arduinoSource);

            grades.push({
              section: "Station 3: Arduino",
              checks: [
                result(
                  arduinoConnects,
                  1,
                  "Connects to the Arduino through serial"
                ),

                result(
                  arduinoReads,
                  1,
                  "Reads serial sensor output"
                ),

                result(
                  parsesSerialData(arduinoSource),
                  1,
                  "Parses the serial output"
                ),

                result(
                  arduinoStructuresData,
                  1,
                  "Stores sensor readings in a structured format"
                ),

                result(
                  arduinoSavesData,
                  1,
                  "Stores collected data in a DataFrame or CSV"
                ),

                result(
                  displaysData(arduinoSource) &&
                  countNotes(arduinoSource) >= 3,
                  1,
                  "Displays collected data and includes at least 3 lines of notes"
                )
              ]
            });

            // =======================================================
            // CALCULATE SCORE
            // =======================================================

            let total = 0;
            let possible = 0;

            for (const section of grades) {
              for (const check of section.checks) {
                total += check.points;
                possible += check.possible;
              }
            }

            // =======================================================
            // BUILD COMMENT
            // =======================================================

            let body = `${MARKER}
            ## 🤖 Week 2 Autograder

            **Score: ${total} / ${possible}**

            `;

            for (const section of grades) {

              const sectionScore = section.checks.reduce(
                (sum, check) => sum + check.points,
                0
              );

              const sectionPossible = section.checks.reduce(
                (sum, check) => sum + check.possible,
                0
              );

              body += `### ${section.section} — ${sectionScore}/${sectionPossible}\n\n`;

              for (const check of section.checks) {
                const symbol = check.passed ? "✅" : "❌";

                body += `${symbol} ${check.description} — **${check.points}/${check.possible}**\n`;
              }

              body += "\n";
            }

            body += `
            ---
            This automated score checks the technical requirements of the assignment. Equivalent implementations may satisfy the same requirement. Human reviewers may adjust the final grade based on the quality and correctness of the submission.
            `;

            // =======================================================
            // CREATE OR UPDATE COMMENT
            // =======================================================

            const comments = await github.paginate(
              github.rest.issues.listComments,
              {
                owner,
                repo,
                issue_number: pull_number,
                per_page: 100
              }
            );

            const existingComment = comments.find(
              comment =>
                comment.user.type === "Bot" &&
                comment.body.includes(MARKER)
            );

            if (existingComment) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existingComment.id,
                body
              });
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: pull_number,
                body
              });
            }

            console.log(`Week 2 score: ${total}/${possible}`);

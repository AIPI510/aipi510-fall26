name: PR Description Check

on:
  pull_request_target:
    types: [opened, reopened, ready_for_review, edited]

permissions:
  pull-requests: write
  issues: write

jobs:
  check-description:
    runs-on: ubuntu-latest

    steps:
      - name: Check PR description
        uses: actions/github-script@v8
        with:
          script: |
            const { owner, repo } = context.repo;
            const pull_number = context.issue.number;

            const MARKER = "<!-- pr-description-warning -->";

            // Get current PR information
            const { data: pr } = await github.rest.pulls.get({
              owner,
              repo,
              pull_number
            });

            // Get existing comments
            const comments = await github.paginate(
              github.rest.issues.listComments,
              {
                owner,
                repo,
                issue_number: pull_number,
                per_page: 100
              }
            );

            // Find an existing reminder from this workflow
            const existingComment = comments.find(
              comment =>
                comment.user.type === "Bot" &&
                comment.body.includes(MARKER)
            );

            // Check whether the PR has a meaningful description
            const hasDescription =
              pr.body &&
              pr.body.trim().length > 0;

            if (!hasDescription) {

              const body = `${MARKER}
            ### ⚠️ PR Description Missing

            Please add a description explaining what you changed in this assignment before requesting review.

            _This is an automated reminder._`;

              if (existingComment) {
                await github.rest.issues.updateComment({
                  owner,
                  repo,
                  comment_id: existingComment.id,
                  body
                });
              } else {
                await github.rest.issues.createComment({
                  owner,
                  repo,
                  issue_number: pull_number,
                  body
                });
              }

            } else if (existingComment) {

              // Remove reminder once a description is added
              await github.rest.issues.deleteComment({
                owner,
                repo,
                comment_id: existingComment.id
              });
            }
